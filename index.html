		async function getVideo(videoId, divVideoObject){
			const videoData = await getVideoData(videoId);

		function saveToCache(cacheKey, data) {
			try {
				sessionStorage.setItem(cacheKey, JSON.stringify(data));
			} catch (e) {
				console.warn("Could not store data in sessionStorage", e);
			}
		}

		function loadFromCache(cacheKey) {
			try {
				const cached = sessionStorage.getItem(cacheKey);
				if (!cached) return null;
				return JSON.parse(cached);
			} catch (e) {
				console.warn("Cache corrupted, ignoring", e);
				return null;
			}
		}

		async function getVideoData(videoId) {
			const cachedData = loadFromCache(videoId);

			// --- Return cached result if present ---
			if (cachedData) {
				log(`Returning cached video data for ${videoId}`);
				return cachedData;
			}

			// --- Not cached -> Fetch API ---
			try {
				const url = `https://ytstream-download-youtube-videos.p.rapidapi.com/dl?id=${videoId}`;

				const response = await fetch(url, {
					method: "GET",
					headers: {
						"X-RapidAPI-Key": xRapidAPIKey,
						"X-RapidAPI-Host": "ytstream-download-youtube-videos.p.rapidapi.com"
					}
				});

				if (!response.ok) {
					log(`Error fetching video data: ${response.status} ${response.statusText}`);
					return null;
				}

				const responseData = await response.json();

				// Validate response
				if (responseData && typeof responseData === 'object') {
					saveToCache(videoId, responseData);
				}

				return responseData;

			} catch (error) {
				log("Error during API request: " + error.message);
				return null;
			}
		}

		function downloadVideo(id, videoData, divVideoObject){
				if (videoData !== undefined && videoData !== null && videoData.constructor == Array ){
					log("Couldn't get video data for " + id);
					return;
				} else {
					var media_type  = document.getElementById('media_type').value; 
					var action  = document.getElementById('action').value;
					videoURL = getVideoURL(videoData,media_type);
					videoThumbnail = getVideoThumbNail(videoData);
					if (!videoURL) {  // Covers: null, undefined, "", 0, false, NaN
						log("Couldn't get video url for " + id);
						return;
					}
					fileName = getFileName(videoData, media_type);
					// add &title=download name at the end to choose the desired save filename
					videoURL = videoURL + '&title=' + encodeURIComponent(fileName);					
					
				switch (action) {
					  case "iframe":
							//log("Downloading " + fileName);
							setIFrame(divVideoObject, videoURL, fileName);
							break;
					  case "video":
						    setVideo(divVideoObject, videoURL, videoThumbnail);
							break;
					  case "aref":
							setARef(divVideoObject, videoURL, fileName)
							break;
					}
				}			
		}
		
		function setIFrame(divVideoObject, videoURL, fileName){
			/**
			Function to download the video to disk, ideally with a customized file name
			
			From https://stackoverflow.com/questions/1066452/easiest-way-to-open-a-download-window-without-navigating-away-from-the-page

			Don't remember what this does:
			window.open(url, 'download_window', 'toolbar=0,location=no,directories=0,status=0,scrollbars=0,resizeable=0,width=1,height=1,top=0,left=0');
			window.focus();
			
			*/
			var downloadFrame = document.createElement("iframe"); 
			downloadFrame.setAttribute('src',videoURL);
			downloadFrame.setAttribute('name',fileName);
			//downloadFrame.setAttribute('id',id);
			downloadFrame.setAttribute('style',"border:none;");
			divVideoObject.appendChild(downloadFrame);

		}

		function setVideo(divVideoObject, videoURL, videoThumbnail){
			/**
				https://developer.mozilla.org/en-US/docs/Web/HTML/Element/video
				
			*/
			var videoObj = document.createElement("video"); 
			videoObj.setAttribute('controls',"");
			videoObj.setAttribute('src',videoURL);
			if (videoThumbnail != ""){
				videoObj.setAttribute('poster',videoThumbnail);
			}
			videoObj.setAttribute('width',"360");
						
			var frameLabel = document.createElement("label"); 
			//frameLabel.setAttribute('for',id);
			frameLabel.textContent = fileName;
			
			divVideoObject.appendChild(frameLabel);
			divVideoObject.appendChild(document.createElement("br"));
			divVideoObject.appendChild(videoObj);
			divVideoObject.appendChild(document.createElement("br"));
		}
		
		function setARef(divVideoObject, videoURL, fileName){

			Function to append a video object to the screen

			// from https://stackoverflow.com/questions/1066452/easiest-way-to-open-a-download-window-without-navigating-away-from-the-page
			*/
			// console.log(videoURL);

			divVideoObject.appendChild(downloadLink);
			// downloadLink.id = id
			downloadLink.style.display = "none";
			downloadLink.href = videoURL;
			downloadLink.download = fileName;
  		    downloadLink.click();

		}
		
		function getFileName(videoData, media_type){
			var fileName = validFileName(videoData["title"]) + "_" + media_type;	
			return fileName;
		}
		
		function sleep(milliseconds) {
		  var start = new Date().getTime();
		  for (var i = 0; i < 1e7; i++) {
		    if ((new Date().getTime() - start) > milliseconds){
		      break;
		    }
		  }
		}
		
		function validFileName(s){
			return s.replace(/[<>:"/\\|?*]/g, '')
		}
		
		function getVideoURL(videoData,media_type){
			// Parses videoData and extracts the right url based on the requested media format
			if (!(videoData.hasOwnProperty('status'))) {
				log("Returned video data has no status field");
				return "";
			}
			if (videoData.status != "OK"){
				log("Returned video status is not OK");
				return "";
			}
			if (!(videoData.hasOwnProperty('title') && videoData.hasOwnProperty('formats') && videoData.hasOwnProperty('adaptiveFormats'))) {
				log("Returned video data has no fields title, formats and adaptiveFormats");
				return "";
			}				
			let result = getBestUrl(videoData, media_type);
			if (!result && media_type==="720p"){
				result = getBestUrl(videoData, "360p");
			}
			return result
		}

		function getBestUrl(apiResponse, media_type) {
			if (!apiResponse) return null;

			/* --------------------- AUDIO FILTERING --------------------- */

			function isValidAudioTrack(item) {
				const track = item.audioTrack;
				
				// Reject auto-dubbed
				if (track && "isAutoDubbed" in track && track.isAutoDubbed !== false) return false;

				return true;
			}

			function filterAudioMime(items, preferredType, fallbackType) {
				let primary = items.filter(item =>
					item.mimeType &&
					item.mimeType.includes(preferredType) &&
					isValidAudioTrack(item)
				);

				if (primary.length > 0) return primary;

				return items.filter(item =>
					item.mimeType &&
					item.mimeType.includes(fallbackType) &&
					isValidAudioTrack(item)
				);
			}

			/* --------------------- VIDEO FILTERING --------------------- */

			function filterVideoMime(items, media_type) {
				if (!items) return [];

				// Match the requested resolution: "720p", "360p"
				let resolutionMatches = items.filter(item =>
					item.qualityLabel === media_type
				);

				if (resolutionMatches.length === 0) return [];

				// Prefer video/mp4
				let mp4Videos = resolutionMatches.filter(item =>
					item.mimeType && item.mimeType.includes("video/mp4")
				);

				if (mp4Videos.length > 0) return mp4Videos;

				// Fallback: any other video type (e.g., video/webm)
				return resolutionMatches.filter(item =>
					item.mimeType && item.mimeType.includes("video/")
				);
			}

			/* --------------------- BITRATE PICKER --------------------- */

			function selectHighestBitrate(items) {
				if (!items || items.length === 0) return null;

				return items.reduce((max, item) => {
					const current = item.bitrate || item.averageBitrate || 0;
					const prev = max.bitrate || max.averageBitrate || 0;
					return current > prev ? item : max;
				});
			}

			/* --------------------- MAIN LOGIC --------------------- */

			if (media_type === "audio") {
				const preferredMime = "audio/mp4";
				const fallbackMime = "audio/webm";

				let candidates = filterAudioMime(apiResponse.formats || [], preferredMime, fallbackMime);

				if (candidates.length === 0) {
					candidates = filterAudioMime(apiResponse.adaptiveFormats || [], preferredMime, fallbackMime);
				}

				const best = selectHighestBitrate(candidates);
				return best ? best.url : null;
			}

			/* --------------------- VIDEO LOGIC --------------------- */

			if (media_type === "720p" || media_type === "360p") {
				let candidates = filterVideoMime(apiResponse.formats || [], media_type);

				if (candidates.length === 0) {
					candidates = filterVideoMime(apiResponse.adaptiveFormats || [], media_type);
				}

				const best = selectHighestBitrate(candidates);
				return best ? best.url : null;
			}

			// Unknown media_type
			return null;
		}

		function getVideoThumbNail(videoData){
			result = videoData.thumbnail;
			if (result.length != 0){
				result = [getMax(result, "width")];
				return result[0]['url'];
			}
			return "";
		}
		
		function getMax(array, propName) {
		    var max = 0;
		    var maxItem = null;
		    for(var i=0; i<array.length; i++) {
		        var item = array[i];
		        if(item[propName] > max) {
		            max = item[propName];
		            maxItem = item;
		        }
		    }
		
		    return maxItem;
		}

			log(idArray);

		function youtube_id_parser(url){
			var regExp = /^.*(youtu\.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
			var match = url.match(regExp);
			if (match && match[2].length == 11) {
			  return match[2];
			} else {
			  return "";
			}
		}

                <optgroup label="Video">

                    <option value="360p">360p</option>
                </optgroup>
                <optgroup label="Audio">
                    <option value="audio">Audio</option>
                </optgroup>
            </select>

            <label for="action">Action:</label>
            <select id="action">
                <option value="video">Open here</option>
                <option value="iframe">Download</option>
                <option value="aref">Download (2)</option>
            </select>
        </div>

        <div class="buttons">
            <button class="download" onclick="main()">Go</button>
            <button class="clear" onclick="clearForm()">Clear</button>
        </div>

        <label for="inputURLs" style="margin-top:12px;">Paste YouTube URLs:</label>
        <textarea id="inputURLs" rows="6" placeholder="https://youtu.be/..."></textarea>
    </div>

    <!-- Video frames appear here -->
    <div id="videoResults"></div>

</div>

<!-- =============== ADMIN SECTION =============== -->
<div id="adminSection" class="section">
    <button id="clearCacheBtn" onclick="sessionStorage.clear(); log('Session cache cleared!');">
        Clear Session Cache
    </button>

    <textarea id="adminConsole" readonly placeholder="Console output..."></textarea>
</div>

<!-- =============== TAB BAR =============== -->
<div class="tab-bar">
    <div id="tabHome" class="tab active" onclick="switchTab('home')">Home</div>
    <div id="tabAdmin" class="tab" onclick="switchTab('admin')">Admin</div>
</div>

<script>
/* ---------------- TAB SWITCHING ---------------- */
function switchTab(tab) {
    document.getElementById("homeSection").classList.remove("active");
    document.getElementById("adminSection").classList.remove("active");
    document.getElementById("tabHome").classList.remove("active");
    document.getElementById("tabAdmin").classList.remove("active");

    if (tab === "home") {
        document.getElementById("homeSection").classList.add("active");
        document.getElementById("tabHome").classList.add("active");
    } else {
        document.getElementById("adminSection").classList.add("active");
        document.getElementById("tabAdmin").classList.add("active");
    }
}

/* ---------------- LOGGER ---------------- */
function log(msg) {
    console.log(msg);
	const consoleBox = document.getElementById("adminConsole");
    consoleBox.value += msg + "\n";
    consoleBox.scrollTop = consoleBox.scrollHeight;
}
</script>

</body>
</html>
